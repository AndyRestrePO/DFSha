services:
  controlnode:
    build: ./controlnode
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DFSHA_STATE_FILE=/app/data/state.json
      - DFSHA_INTERNAL_SECRET=${DFSHA_INTERNAL_SECRET:-local-dfsha-secret-change-before-deploy}
      - DFSHA_TOTP_ENCRYPTION_KEY=${DFSHA_TOTP_ENCRYPTION_KEY:-}
      - DFSHA_VALE_PASSWORD=${DFSHA_VALE_PASSWORD:-vale123}
      - DFSHA_ADMIN_PASSWORD=${DFSHA_ADMIN_PASSWORD:-admin123}
      - REPLICATION_FACTOR=${REPLICATION_FACTOR:-2}
      - HEARTBEAT_TIMEOUT=${HEARTBEAT_TIMEOUT:-15}
      - REPAIR_INTERVAL=${REPAIR_INTERVAL:-10}
    volumes:
      - controlstate:/app/data

  datanode1:
    build: ./datanode
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - CONTROL_URL=http://controlnode:8000
      - DATANODE_ID=dn1
      - DATANODE_URL=${DFSHA_DATANODE1_URL:-http://localhost:8001}
      - DATANODE_INTERNAL_URL=http://datanode1:8000
      - DFSHA_INTERNAL_SECRET=${DFSHA_INTERNAL_SECRET:-local-dfsha-secret-change-before-deploy}
      - DFSHA_BLOCK_ENCRYPTION_KEY=${DFSHA_BLOCK_ENCRYPTION_KEY:-}
    volumes:
      - data1:/app/blocks
    depends_on:
      - controlnode

  datanode2:
    build: ./datanode
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      - CONTROL_URL=http://controlnode:8000
      - DATANODE_ID=dn2
      - DATANODE_URL=${DFSHA_DATANODE2_URL:-http://localhost:8002}
      - DATANODE_INTERNAL_URL=http://datanode2:8000
      - DFSHA_INTERNAL_SECRET=${DFSHA_INTERNAL_SECRET:-local-dfsha-secret-change-before-deploy}
      - DFSHA_BLOCK_ENCRYPTION_KEY=${DFSHA_BLOCK_ENCRYPTION_KEY:-}
    volumes:
      - data2:/app/blocks
    depends_on:
      - controlnode

  datanode3:
    build: ./datanode
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      - CONTROL_URL=http://controlnode:8000
      - DATANODE_ID=dn3
      - DATANODE_URL=${DFSHA_DATANODE3_URL:-http://localhost:8003}
      - DATANODE_INTERNAL_URL=http://datanode3:8000
      - DFSHA_INTERNAL_SECRET=${DFSHA_INTERNAL_SECRET:-local-dfsha-secret-change-before-deploy}
      - DFSHA_BLOCK_ENCRYPTION_KEY=${DFSHA_BLOCK_ENCRYPTION_KEY:-}
    volumes:
      - data3:/app/blocks
    depends_on:
      - controlnode

volumes:
  controlstate:
  data1:
  data2:
  data3:
  